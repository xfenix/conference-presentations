name: Deploy presentations to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Generate revealjs/README.md
        run: |
          base_url="https://${{ github.repository_owner }}.github.io/conference-presentations"
          echo "# Presentations" > revealjs/README.md
          for d in revealjs/*/; do
            name=$(basename "$d")
            [ "$name" = "_template" ] && continue
            echo "- [$name](${base_url}/${name}/)" >> revealjs/README.md
          done

      - name: Commit and push README.md
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add revealjs/README.md
          git commit -m "Update revealjs/README.md with presentation links" || exit 0
          git push

  deploy:
    needs: update-readme
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - run: |
          mkdir public
          shopt -s extglob
          cp -r revealjs/!(\_template) public/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
