name: Deploy presentations to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Generate revealjs/README.md
        run: |
          base_url="https://${{ github.repository_owner }}.github.io/conference-presentations"
          echo "# Presentations" > revealjs/README.md

          # Main presentations
          for d in revealjs/*/; do
            name=$(basename "$d")
            [ "$name" = "_template" ] && continue
            [ "$name" = "archive" ] && continue
            echo "- [$name](${base_url}/${name}/)" >> revealjs/README.md
          done

          # Archive presentations
          echo -e "\n### Archived Presentations" >> revealjs/README.md
          for d in revealjs/archive/*/; do
            name=$(basename "$d")
            echo "- [$name](${base_url}/${name}/)" >> revealjs/README.md
          done

      - name: Commit and push README.md
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add revealjs/README.md
          git commit -m "Update revealjs/README.md with presentation links" || exit 0
          git push

  deploy:
    needs: update-readme
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Generate index.html and copy presentations
        run: |
          base_url="https://${{ github.repository_owner }}.github.io/conference-presentations"

          # Generate index.html
          echo '<!DOCTYPE html>
          <html>
          <head>
              <title>Conference Presentations</title>
              <style>
                  body { font-family: Arial, sans-serif; line-height: 1.6; max-width: 800px; margin: 0 auto; padding: 20px; }
                  h1 { color: #333; }
                  ul { list-style-type: none; padding: 0; }
                  li { margin: 10px 0; }
                  a { color: #0366d6; text-decoration: none; }
                  a:hover { text-decoration: underline; }
              </style>
          </head>
          <body>
              <h1>Conference Presentations</h1>
              <ul>' > index.html

          mkdir public
          # Copy all presentations including archive (without archive folder structure)
          cp -r revealjs/* public/
          for d in revealjs/archive/*/; do
            name=$(basename "$d")
            cp -r "$d" "public/$name"
          done

          # Main presentations
          for d in revealjs/*/; do
            name=$(basename "$d")
            [ "$name" = "_template" ] && continue
            [ "$name" = "archive" ] && continue
            echo "                  <li><a href=\"${base_url}/${name}/\">${name}</a></li>" >> index.html
          done

          # Archive presentations
          echo '              </ul>
              <h4>Archived Presentations</h4>
              <ul>' >> index.html
          for d in revealjs/archive/*/; do
            name=$(basename "$d")
            echo "                  <li><a href=\"${base_url}/${name}/\">${name}</a></li>" >> index.html
          done

          echo '              </ul>
          </body>
          </html>' >> index.html

          mv index.html public/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
